<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ERI Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
  <div id="map"></div>
  <script>
    const ERI_OFFICE = [45.6661250, -111.0483080];

    const map = L.map('map').setView(ERI_OFFICE, 18);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    L.marker(ERI_OFFICE, 221 AJM Johnson Hall).addTo(map)
      .bindPopup('<b>ERI Office</b>')
      .bindTooltip('ERI Office', { permanent: true, direction: 'right', offset: [12, -20] })
      .openPopup();
  </script>
</body>
</html>
